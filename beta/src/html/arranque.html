<script>
/* arranque animado: la montaña del logo girando mientras carga; tocar lo salta */
(function(){
  var s=document.getElementById("splash");
  if(!s || !window.PeakAnim || !window.Path2D) return;
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var c=document.createElement("canvas"); s.appendChild(c); s.classList.add("anim");
  var oscuro=document.documentElement.classList.contains("dark");
  /* sin cuenta (la primera vez, o tras cerrar sesión) el logo se despliega entero (el icono gira, se
     hace pequeño y salen las letras) y de ahí a la entrada; con cuenta, solo la montaña girando */
  var primera=true; try{ primera=!localStorage.getItem("dtrack-sesion"); }catch(e){}
  window.__splashAnim=PeakAnim(c,{ pattern:primera ? "frena" : "gira", dark:oscuro });
  window.__splashMin=Date.now()+(primera ? 3700 : 1200);
  s.addEventListener("pointerdown", function(){ window.__splashMin=0; if(window.splashFuera) splashFuera(); });
})();
</script>
