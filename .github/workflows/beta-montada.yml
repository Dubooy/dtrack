name: Beta montada

# beta/index.html se monta con las piezas de beta/src/. Si alguien edita
# index.html a mano (o se olvida de montarla), esto se pone en rojo.
on:
  push:
    paths:
      - "beta/index.html"
      - "beta/src/**"
      - "herramientas/montar-beta.js"
  workflow_dispatch:

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node herramientas/montar-beta.js --comprobar
